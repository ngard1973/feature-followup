<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feature Follow-Up (Prototype)</title>
<style>
:root{--bg:#eceef1;--card:#fff;--ink:#23272e;--mut:#6b7280;--amb:#d98e04;--line:#d6d9de}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.ban{background:var(--amb);color:#fff;text-align:center;font-size:13px;padding:6px;font-weight:600}
header{background:var(--ink);color:#fff;padding:14px 16px;font-weight:700;font-size:18px}header span{color:var(--amb)}
main{max-width:560px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:600;width:100%;margin-top:10px}
button.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}button.amb{background:var(--amb)}button:disabled{opacity:.4}
.msg{font-size:13px;margin-top:6px}.ok{color:#15803d}.bad{color:#b91c1c}
.cat{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:12px 0 4px}
.feat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tog{width:46px;height:26px;border-radius:13px;background:#ccc;position:relative;flex:none}.tog.on{background:var(--amb)}
.tog::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}.tog.on::after{left:22px}
.tag{font-size:11px;background:#fdf3dc;color:#8a5a00;padding:2px 7px;border-radius:10px}
ol{padding-left:20px;margin:8px 0}.small{font-size:12px;color:var(--mut)}
nav{display:flex;gap:6px;margin-bottom:12px}nav button{margin:0;padding:9px;font-size:13px}
</style></head><body>
<div class="ban">PROTOTYPE — sample instructions only. Do not send to real customers yet.</div>
<header>Feature <span>Follow-Up</span></header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
let deliveryReplayDb = null;
let confusionReportInFlight = false;

try {
  const publishableKey = cmbreoocqgzilymsgfwy;

  if (publishableKey.startsWith("sb_publishable_")) {
    deliveryReplayDb = window.supabase.createClient(
      "https://cmbreoocqgzilymsgfwy.supabase.co",
      publishableKey,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );
  }
} catch {
  // Keep the prototype usable if the connection cannot initialize.
}
</script>
<script>
const FEATS={Phone:[["bt","Bluetooth phone pairing",1,["Open Settings on the touchscreen.","Choose Phone, then Add Phone.","Pick the vehicle name on your phone and confirm the code."]],["cp","Wireless Apple CarPlay / Android Auto",1,["Turn on Bluetooth and Wi-Fi on your phone.","Pair the phone, then accept the CarPlay/Android Auto prompt.","Next time it connects automatically."]],["app","Manufacturer app & remote start",3,["Download the brand app and sign in.","Add the vehicle using your VIN.","Use Remote Start from the app home screen."]]],
Safety:[["acc","Adaptive cruise control",3,["Press the cruise button to arm.","Set speed with SET.","Use the gap button to change following distance."]],["lka","Lane keep assist",7,["Press the lane keep button on the steering wheel or console.","A green steering-wheel icon means it is active."]],["bsm","Blind zone alert",7,["Watch for the light in the side mirror.","It flashes if you signal while a vehicle is beside you."]]],
Comfort:[["hs","Heated/ventilated seats",1,["Tap Climate on the touchscreen.","Choose the seat icon and level."]],["auto","Auto climate settings",7,["Press AUTO and set a temperature.","The system manages fan and vents for you."]],["mem","Memory seat & mirrors",30,["Set seat and mirrors how you like.","Hold SET then 1 or 2 until it beeps."]]],
Tech:[["hud","Head-up display",30,["Use the HUD control to turn it on.","Adjust brightness and height in Settings > Display."]],["ota","Software updates",30,["Park with Wi-Fi or cellular connection.","Go to Settings > Vehicle > Software and follow the prompts."]]]};
const ALL={};for(const c in FEATS)for(const f of FEATS[c])ALL[f[0]]={c,name:f[1],day:f[2],steps:f[3]};
const $=s=>document.querySelector(s),app=$("#app");
const st=JSON.parse(localStorage.ffu_me||'{"name":"","phone":""}');let veh={vin:"",year:"",make:"",model:"",trim:""},sel=new Set(),cust="";
function vinCheck(v){if(v.length!==17)return"VIN must be 17 characters ("+v.length+" entered).";if(/[IOQ]/.test(v))return"VINs never use I, O, or Q.";
const map={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9},w=[8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];let s=0;
for(let i=0;i<17;i++){const ch=v[i],n=/\d/.test(ch)?+ch:map[ch];if(n===undefined)return"Invalid character: "+ch;s+=n*w[i]}const r=s%11,c=r===10?"X":String(r);
return v[8]===c?"":"Check digit doesn't match. Double-check the VIN for a typo."}
function nav(t){return`<nav><button class="${t=='s'?'amb':'alt'}" onclick="setup()">New delivery</button><button class="${t=='l'?'amb':'alt'}" onclick="list()">Customers</button><button class="${t=='m'?'amb':'alt'}" onclick="me()">My info</button></nav>`}
function setup(){app.innerHTML=nav('s')+`<div class="card"><h2>1. Vehicle</h2><label>VIN</label><input id="vin" maxlength="17" autocapitalize="characters" value="${veh.vin}" placeholder="17-character VIN">
<button class="alt" disabled>Scan door-jamb barcode (coming next)</button><button onclick="look()">Look up VIN</button><div id="vm" class="msg"></div>
<div class="row"><div><label>Year</label><input id="year" value="${veh.year}"></div><div><label>Make</label><input id="make" value="${veh.make}"></div></div>
<div class="row"><div><label>Model</label><input id="model" value="${veh.model}"></div><div><label>Trim</label><input id="trim" value="${veh.trim}"></div></div>
<p class="small">Confirm or correct these. VIN data can't tell which options are installed.</p></div>
<div class="card"><h2>2. Features you showed</h2>${Object.keys(FEATS).map(c=>`<div class="cat">${c}</div>`+FEATS[c].map(f=>`<div class="feat" onclick="tg('${f[0]}',this)"><span>${f[1]} <span class="tag">Day ${f[2]}</span></span><div class="tog ${sel.has(f[0])?'on':''}"></div></div>`).join("")).join("")}</div>
<div class="card"><h2>3. Customer</h2><label>Customer first name</label><input id="cust" value="${cust}"><label>Customer mobile (optional)</label><input id="cph" type="tel">
<button class="amb" onclick="make()">Create customer link</button><div id="out"></div></div>`}
function grab(){for(const k of["vin","year","make","model","trim"])veh[k]=$("#"+k).value.trim().toUpperCase()===""?"":(k=="vin"?$("#"+k).value.trim().toUpperCase():$("#"+k).value.trim());cust=$("#cust").value.trim()}
function tg(id,el){sel.has(id)?sel.delete(id):sel.add(id);el.querySelector(".tog").classList.toggle("on")}
async function look(){grab();const m=$("#vm"),e=vinCheck(veh.vin);if(e){m.className="msg bad";m.textContent=e;return}
m.className="msg";m.textContent="Looking up…";try{const r=await fetch("https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/"+veh.vin+"?format=json"),j=(await r.json()).Results[0];
veh.year=j.ModelYear||"";veh.make=j.Make||"";veh.model=j.Model||"";veh.trim=j.Trim||"";setup();$("#vm").className="msg ok";$("#vm").textContent="Decoded. Please confirm the details."+(veh.trim?"":" Trim not provided; type it in.")}
catch(x){m.className="msg bad";m.textContent="Lookup failed. Type the details in by hand."}}
function make(){grab();const o=$("#out");if(!veh.model||!sel.size){o.innerHTML='<p class="msg bad">Add the model and at least one feature.</p>';return}
let salespersonId = localStorage.getItem("ffu_salesperson_id");

if (!salespersonId) {
  salespersonId = crypto.randomUUID();
  localStorage.setItem("ffu_salesperson_id", salespersonId);
}

const d = {
  v: [veh.year, veh.make, veh.model, veh.trim]
    .filter(Boolean)
    .join(" "),
  c: cust,
  n: st.name,
  p: st.phone,
  f: [...sel],
  salesperson_id: salespersonId,
  customer_token: crypto.randomUUID()
};
const url=location.origin+location.pathname+"#c="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d)))));
const L=JSON.parse(localStorage.ffu_list||"[]");L.unshift({c:cust||"Customer",v:d.v,t:new Date().toLocaleDateString(),url});localStorage.ffu_list=JSON.stringify(L);
const txt=`Hi ${cust||"there"}, it's ${st.name||"your salesperson"}. Here are quick how-tos for the features we went over on your ${d.v}: ${url}`,ph=$("#cph").value.replace(/\D/g,"");
o.innerHTML=`<p class="msg ok">Link ready.</p><a href="sms:${ph}${/iPhone|iPad/.test(navigator.userAgent)?"&":"?"}body=${encodeURIComponent(txt)}"><button>Text the link</button></a><button class="alt" onclick="navigator.clipboard.writeText('${url}').then(()=>this.textContent='Copied')">Copy link</button><a href="${url}" target="_blank"><button class="alt">Preview customer page</button></a>`}
function list(){const L=JSON.parse(localStorage.ffu_list||"[]");app.innerHTML=nav('l')+`<div class="card"><h2>Customers (saved on this phone only)</h2>${L.length?L.map(x=>`<div class="feat"><span>${x.c}<br><span class="small">${x.v} · ${x.t}</span></span><a href="${x.url}" target="_blank">Open</a></div>`).join(""):'<p class="small">No links sent yet.</p>'}</div>`}
function me(){app.innerHTML=nav('m')+`<div class="card"><h2>My info</h2><label>Your name</label><input id="mn" value="${st.name}"><label>Your phone</label><input id="mp" type="tel" value="${st.phone}"><button onclick="st.name=$('#mn').value;st.phone=$('#mp').value;localStorage.ffu_me=JSON.stringify(st);this.textContent='Saved'">Save</button></div>`}
function custView(d){const S=JSON.parse(localStorage["ffu_s_"+location.hash]||"{}");const save=()=>localStorage["ffu_s_"+location.hash]=JSON.stringify(S);
window.mark = async (id, value) => {
  // "Got it" continues to save on the customer's device.
  if (value !== "c") {
    S[id] = value;
    save();
    custView(d);
    return;
  }

  // Avoid sending another report while one is being saved.
  if (confusionReportInFlight) return;

  // Older links do not contain the new report identifiers.
  if (!d.salesperson_id || !d.customer_token) {
    alert(
      "This older link cannot send help requests. " +
      "Please contact your salesperson for a new link."
    );
    return;
  }

  if (!deliveryReplayDb) {
    alert(
      "Help requests are unavailable. " +
      "Please contact your salesperson directly."
    );
    return;
  }

  confusionReportInFlight = true;

  try {
    const { error } = await deliveryReplayDb
      .from("confusion_alerts")
      .insert({
        salesperson_id: d.salesperson_id,
        customer_token: d.customer_token,
        card_id: id
      });

    if (error) {
      alert(
        "Your request was not saved. Error code: " +
        (error.code || "unknown") +
        ". Please contact your salesperson directly."
      );
      return;
    }

    // Mark the card only after Supabase confirms success.
    S[id] = "c";
    save();
    custView(d);

    alert("Your request for help was saved.");
  } catch {
    alert(
      "Could not confirm whether your request was saved. " +
      "Please contact your salesperson directly."
    );
  } finally {
    confusionReportInFlight = false;
  }
};
app.innerHTML=`<div class="card"><h2>Hi ${d.c||"there"}, enjoy your ${d.v}</h2><p class="small">Quick how-tos for what we covered.${d.n?` Questions? ${d.n}${d.p?` · <a href="tel:${d.p}">${d.p}</a>`:""}`:""}</p></div>`+
d.f.filter(id=>ALL[id]).sort((a,b)=>ALL[a].day-ALL[b].day).map(id=>{const f=ALL[id];return`<div class="card"><h2>${f.name} <span class="tag">Day ${f.day}</span></h2><ol>${f.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
<div class="row"><button class="${S[id]=='g'?'amb':'alt'}" onclick="mark('${id}','g')">Got it</button><button class="${S[id]=='c'?'amb':'alt'}" onclick="mark('${id}','c')">Still confused</button></div></div>`}).join("")}
const h=location.hash.match(/^#c=(.+)/);if(h){try{custView(JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h[1]))))))}catch(e){app.innerHTML='<div class="card">This link looks damaged.</div>'}}else setup();
</script></body></html>
